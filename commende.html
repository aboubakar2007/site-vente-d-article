<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <section>
            <h1>commender votre article</h1>
          <form action="commander">
            <div class="input-box">
                <div class="input">
                    <input type="text" placeholder="nom complet" required>
                </div>
                <div class="input">
                    <input type="tel" placeholder="numéro de téléphopne" required>
                </div>
                <div class="input">
                    <input type="email" placeholder="adresse mail" required>
                </div>
            </div>
            <div class="option-box">
                <select name="article" id="article">
                   <option value="">CHEMISE</option>
                   <option value="">chaussette</option>
                   <option value="">DENIMS</option>
                   <option value="">COSTUMES</option>
                   <option value="">VESTONS</option>
                   <option value="">CHEMISES</option>
                </select>
            </div>
            <div class="btn-sub">
                <button type="submit">commander</button>
            </div>

            <div class="retour">
                <a href="index.html">retour à la page d'accueil</a>
            </div>
          </form>

    </section>
</body>
</html>
